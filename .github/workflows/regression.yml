name: BankBridgeNext regression tests

on:
  push:
    branches: [pdf-to-qbo]
  pull_request:
    branches: [pdf-to-qbo]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract and English data
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies and OCR data
        run: |
          python -m pip check
          python -c 'import fitz; assert fitz.get_tessdata(), "Tesseract trained data not found"'
      - name: Run regression suite
        run: python -m unittest discover -s tests -v

  windows-package:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements.txt "pyinstaller==6.*"
      - name: Build BankBridgeNext
        run: python -m PyInstaller --noconfirm --clean BankBridge.spec
      - name: Test Windows updater replacement and rollback
        shell: powershell
        run: .\tests\test_windows_updater.ps1
      - name: Bundle Windows updater and build marker
        shell: powershell
        run: |
          Copy-Item windows/Update-BankBridgeNext.cmd,windows/Update-BankBridgeNext.ps1 dist/BankBridgeNext/
          Set-Content -Path dist/BankBridgeNext/BankBridgeNext.build -Value $env:GITHUB_SHA -Encoding ASCII
      - name: Install browser test dependency
        run: python -m pip install "playwright==1.58.0"
      - name: Check packaged CSV, QBO, and IIF exports
        env:
          PYTHONPATH: .
        run: python tests/windows_package_smoke.py
      - name: Add synthetic statements for manual testing
        if: github.event_name == 'push'
        env:
          PYTHONPATH: .;tests
        shell: python
        run: |
          from pathlib import Path
          from test_rbc_deposit import rbc_statement
          from test_td_deposit import td_statement
          from test_td_easyweb import easyweb_printout

          samples = Path("dist/BankBridgeNext/samples")
          samples.mkdir()
          (samples / "Synthetic-TD-Business-Chequing.pdf").write_bytes(td_statement())
          (samples / "Synthetic-RBC-Business-Chequing.pdf").write_bytes(rbc_statement())
          (samples / "Synthetic-TD-EasyWeb.pdf").write_bytes(easyweb_printout())
      - name: Upload Windows development package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: BankBridgeNext-Windows-x64
          path: dist/BankBridgeNext/
          if-no-files-found: error
          retention-days: 14
