name: BankBridgeNext regression tests

on:
  push:
    branches: [pdf-to-qbo]
  pull_request:
    branches: [pdf-to-qbo]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract and English data
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies and OCR data
        run: |
          python -m pip check
          python -c 'import fitz; assert fitz.get_tessdata(), "Tesseract trained data not found"'
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
