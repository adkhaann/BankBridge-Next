name: BankBridgeNext regression tests

on:
  push:
    branches: [pdf-to-qbo]
  pull_request:
    branches: [pdf-to-qbo]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract and English data
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies and OCR data
        run: |
          python -m pip check
          python -c 'import fitz; assert fitz.get_tessdata(), "Tesseract trained data not found"'
      - name: Run regression suite
        run: python -m unittest discover -s tests -v

  windows-package:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements.txt "pyinstaller==6.*"
      - name: Build BankBridgeNext
        run: python -m PyInstaller --noconfirm --clean BankBridge.spec
      - name: Check the packaged local server
        env:
          PYTHONPATH: .
        run: python tests/windows_package_smoke.py
